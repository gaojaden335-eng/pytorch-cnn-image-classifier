[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-image-classifier-cnn"
version = "1.0.0"
description = "A compact PyTorch CNN training and evaluation project"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
image-classifier-train = "image_classifier.train:main"
image-classifier-evaluate = "image_classifier.evaluate:main"
image-classifier-examples = "image_classifier.examples:main"
image-classifier-experiments = "image_classifier.run_experiments:main"
image-classifier-validate = "image_classifier.validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
